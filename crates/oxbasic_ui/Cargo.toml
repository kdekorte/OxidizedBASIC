[package]
name = "oxbasic_ui"
description = "GPUI & GPUI Kit widget mapping runtime engine (Phase 2 bridge)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imagesize = "0.13"
oxbasic_runtime = { workspace = true }
gpui = { version = "0.2.2", optional = true }

[dev-dependencies]
oxbasic_parser = { workspace = true }

[features]
default = []
gpui = ["dep:gpui"]
