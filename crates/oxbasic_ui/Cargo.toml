[package]
name = "oxbasic_ui"
description = "GPUI & GPUI Kit widget mapping runtime engine (Phase 2 bridge)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imagesize = "0.13"
oxbasic_runtime = { workspace = true }
gpui = { version = "0.2.2", optional = true }
# the same versions GPUI uses: a PSet bitmap is handed to it as an image
image = { version = "0.25", default-features = false, optional = true }
smallvec = { version = "1", optional = true }

# the macOS wait cursor (see src/mac_cursor.rs); the version GPUI uses
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

[dev-dependencies]
oxbasic_parser = { workspace = true }

[features]
default = []
gpui = ["dep:gpui", "dep:image", "dep:smallvec"]
