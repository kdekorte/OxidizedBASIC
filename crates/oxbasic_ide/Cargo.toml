[package]
name = "oxbasic_ide"
description = "OxidizedBASIC desktop IDE application"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oxbasic_ast = { workspace = true }
oxbasic_parser = { workspace = true }
oxbasic_runtime = { workspace = true }
oxbasic_ui = { workspace = true, features = ["gpui"] }
gpui = "0.2.2"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

[[bin]]
name = "oxbasic"
path = "src/main.rs"
