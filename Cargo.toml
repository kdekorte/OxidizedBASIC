[workspace]
resolver = "2"
members = [
    "crates/oxbasic_ast",
    "crates/oxbasic_parser",
    "crates/oxbasic_vb_grammar",
    "crates/oxbasic_runtime",
    "crates/oxbasic_ui",
    "crates/oxbasic_ide",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
oxbasic_ast = { path = "crates/oxbasic_ast" }
oxbasic_parser = { path = "crates/oxbasic_parser" }
oxbasic_runtime = { path = "crates/oxbasic_runtime" }
oxbasic_ui = { path = "crates/oxbasic_ui" }
oxbasic_vb_grammar = { path = "crates/oxbasic_vb_grammar" }
pest = "2.7"
pest_derive = "2.7"

[profile.release]
lto = true

# The interpreter is the hot path of every program the IDE runs (a Mandelbrot
# picture is millions of statements), and unoptimised it is about five times
# slower. Optimise it, and what feeds it, even in a debug build; the IDE's own
# code stays unoptimised for fast builds and good backtraces.
[profile.dev.package.oxbasic_runtime]
opt-level = 3

[profile.dev.package.oxbasic_ast]
opt-level = 3

[profile.dev.package.oxbasic_parser]
opt-level = 3
